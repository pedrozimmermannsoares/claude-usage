name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: python3 -I claude-usage --selftest
      - run: python3 -I agent-usage --selftest
      - run: python3 -I test_redirects.py
