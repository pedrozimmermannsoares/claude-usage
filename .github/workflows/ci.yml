name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    # PR de fork nunca roda no runner próprio.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || fromJSON(vars.CI_RUNS_ON || '["self-hosted","Linux","ARM64","vmpal"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: python3 -I claude-usage --selftest
      - run: python3 -I agent-usage --selftest
      - run: python3 -I test_redirects.py
